# Pin and bus names checked against the stm32c5 data dictionary
[mcu]
serial: /dev/ttyACM0

[printer]
kinematics: none
max_velocity: 300
max_accel: 3000

[output_pin port_a_pin]
pin: PA15

[output_pin port_h_pin]
pin: PH5

[ad5206 spi_test]
enable_pin: PB12
spi_bus: spi2
channel_1: 0.5

[mcp4451 i2c_test]
i2c_address: 44
i2c_bus: i2c1_PB6_PB7
wiper_0: 0.5
